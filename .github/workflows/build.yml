name: Build A37 payload
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
      
      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;27.2.12479018"
      
      - name: Build A37 payload
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          echo "=== BUILDING A37 PAYLOAD ==="
          make clean || true
          make TARGET=a37-A376BXXS4AZG4
          echo "=== BUILD COMPLETE ==="
          ls -la build/
      
      - name: Collect payload
        run: |
          mkdir -p a37-payload
          cp -r build/ a37-payload/
          tar -czf a37-payload.tar.gz a37-payload/
      
      - name: Upload A37 payload
        uses: actions/upload-artifact@v4
        with:
          name: a37-payload
          path: a37-payload.tar.gz
